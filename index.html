<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <script src="/scripts/theme-init.js"></script>
  <!-- Critical paint: match theme before CSS bundle loads -->
  <style>
    html,
    body,
    #root {
      background-color: #FAFAF8;
      color: #0A0A0A;
    }
    html.dark,
    html.dark body,
    html.dark #root {
      background-color: #0A0A0A;
      color: #FAFAF8;
    }
  </style>

  <!-- Preload self-hosted fonts -->
  <link rel="preload" href="/fonts/Inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/JetBrainsMono-latin.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Primary Meta Tags -->
  <title>Akbar — Android &amp; AI Engineer</title>
  <meta name="title" content="Akbar — Android &amp; AI Engineer" />
  <meta name="description"
    content="Android apps built with Kotlin and Jetpack Compose, with practical AI integrations." />
  <meta name="author" content="Akbar Azizov" />
  <meta name="keywords"
    content="Android Developer, Kotlin, Jetpack Compose, AI, Mobile Development, OpenAI, Gemini, Portfolio" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.akbar02work.xyz/" />
  <meta property="og:title" content="Akbar — Android &amp; AI Engineer" />
  <meta property="og:description"
    content="Android apps built with Kotlin and Jetpack Compose, with practical AI integrations." />
  <meta property="og:image" content="https://www.akbar02work.xyz/og-image.png" />
  <meta property="og:site_name" content="Akbar Azizov Portfolio" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://www.akbar02work.xyz/" />
  <meta name="twitter:title" content="Akbar — Android &amp; AI Engineer" />
  <meta name="twitter:description"
    content="Android apps built with Kotlin and Jetpack Compose, with practical AI integrations." />
  <meta name="twitter:image" content="https://www.akbar02work.xyz/og-image.png" />

  <!-- Robots -->
  <meta name="robots" content="index, follow" data-rh="true" />

  <!-- Theme Color - Light and Dark mode support -->
  <meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
