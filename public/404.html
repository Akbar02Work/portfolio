<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0A0A0A" />
  <title>Page not found | Akbar Azizov</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, sans-serif;
      background: #0a0a0a;
      color: #fafaf8;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }
    main { max-width: 42rem; text-align: center; }
    p {
      margin: 0 0 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #a3a3a3;
    }
    h1 {
      margin: 0;
      font-size: clamp(7rem, 38vw, 15rem);
      line-height: .85;
      letter-spacing: -.04em;
      color: #262626;
    }
    a {
      display: inline-block;
      margin-top: 2rem;
      border-bottom: 1px solid #bfff3c;
      padding-bottom: .3rem;
      color: #bfff3c;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <p>// error — page not found</p>
    <h1>404</h1>
    <a href="/">Return home</a>
  </main>
</body>
</html>
