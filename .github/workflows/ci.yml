name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Business dependencies
        run: npm ci

      - name: Install Creative dependencies
        run: npm --prefix creative ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Full Business and Creative CI pipeline
        run: npm run ci:full
        env:
          VITE_SOURCEMAP: "true"
